name: Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEMO_BASE_PATH: /feelable-materials/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22.18.0
          cache: npm
      - run: |
          set -euo pipefail
          npm ci
          npm run check:workflows
          npm run test:ci

  security:
    name: Security
    permissions:
      contents: read
      pull-requests: read # Required by dependency review on pull requests.
    uses: ./.github/workflows/security.yml

  publish:
    name: Publish
    needs: [test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write # Required by actions/deploy-pages.
      id-token: write # Required for Pages OIDC authentication.
    uses: ./.github/workflows/publish.yml

  release:
    name: Release
    needs: [test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write # Required to create GitHub releases.
      pull-requests: write # Required to maintain the release PR.
      id-token: write # Required for npm trusted publishing.
    secrets:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
    uses: ./.github/workflows/release.yml
